checksumBehavior: update

compressionLevel: mixed

enableGlobalCache: false

enableImmutableInstalls: false

nodeLinker: node-modules

packageExtensions:
  debug@*:
    dependencies:
      supports-color: "*"

pnpMode: loose

yarnPath: .yarn/releases/yarn-4.17.1.cjs

# npm quarantined @rolldown/binding-openharmony-arm64@1.2.8 (an optional
# OpenHarmony binding of rolldown, pulled in through vite). Nothing in this
# repository targets OpenHarmony, so stop resolving those platform bindings
# altogether instead of chasing the quarantine.
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
    - musl
