checksumBehavior: update

compressionLevel: mixed

enableGlobalCache: false

enableImmutableInstalls: false

nodeLinker: node-modules

packageExtensions:
  debug@*:
    dependencies:
      supports-color: "*"
  # TypeScript 7's native `typescript` package ships only the `tsc` binary and drops the
  # legacy programmatic compiler API (ts.createDocumentRegistry, ts.Extension, etc). These
  # three tools still call into that API directly, so give each of them their own nested
  # `typescript` dependency pinned to 6.0.3 (the last version with the full API) instead of
  # inheriting the root's 7.0.2. This mirrors Microsoft's own TS6/TS7 side-by-side guidance:
  # https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
  "@typescript-eslint/eslint-plugin@8.67.0":
    dependencies:
      typescript: "6.0.3"
  "@typescript-eslint/parser@8.67.0":
    dependencies:
      typescript: "6.0.3"
  "typescript-eslint@8.67.0":
    dependencies:
      typescript: "6.0.3"
  "rollup-plugin-typescript2@0.37.0":
    dependencies:
      typescript: "6.0.3"

pnpMode: loose

yarnPath: .yarn/releases/yarn-4.17.1.cjs
