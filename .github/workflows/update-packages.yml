name: Update Packages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@main
    with:
      # npm quarantined vite 8.3.x; hold vite until the quarantine is lifted.
      npm-package-exclusions: typescript,vite
    secrets:
      PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS }}
