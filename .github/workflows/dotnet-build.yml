name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: |
    10.0.x
    11.0.x

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/DotNET/**"
      - "Samples/**"
      - ".github/scripts/run-native-aot-smoke.sh"
      - ".github/scripts/run-specifications.sh"
      - ".github/scripts/run-specifications.test.mjs"
      - ".github/scripts/verify-native-specifications.mjs"
      - ".github/scripts/verify-native-specifications.test.mjs"
      - ".github/workflows/dotnet-build.yml"
      - "Directory.Build.props"
      - "Directory.Packages*.props"
      - "Fundamentals.slnx"
      - "global.json"
      - ".globalconfig"
      - ".editorconfig"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .Net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Build .NET projects
        run: dotnet build --configuration Release -p:SpecificationsTestFrameworks='"net10.0;net11.0"'

      - name: Verify specification runner
        run: bash .github/scripts/run-specifications.sh --self-test

      - name: Run specifications
        env:
          SPECIFICATION_FRAMEWORKS: "net10.0 net11.0"
        run: bash .github/scripts/run-specifications.sh Release

      - name: Upload failed specification results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specification-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 3

  native-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .Net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Verify native specification checks
        run: bash .github/scripts/run-native-aot-smoke.sh --self-test

      - name: Run native type-discovery sample and AOT specifications
        run: bash .github/scripts/run-native-aot-smoke.sh linux-x64

      - name: Upload failed native smoke results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-aot-results
          path: TestResults/native-aot/
          if-no-files-found: ignore
          retention-days: 3
