name: Markdown Verification

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Documentation/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "Documentation/**"

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: 'Documentation/**/*.md'

  link-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links in Documentation
        uses: JustinBeckwith/linkinator-action@v2
        with:
          paths: 'Documentation/**/*.md'
          markdown: true
          recurse: true
          redirects: allow
          statusCodes: '403:ok'
          linksToSkip: '^(https?:\/\/)?(localhost|127\.0\.0\.1)(:\d+)?(\/|$)'
