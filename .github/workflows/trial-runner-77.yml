name: Specifications 77 runner trial

on:
  push:
    branches: [trial/runner-77]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    if: github.ref == 'refs/heads/trial/runner-77'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [V0, V4, V6]
    env:
      VARIANT: ${{ matrix.variant }}
      TRIAL_OUTPUT: ${{ github.workspace }}/.ai-work/runner-77
      N: '5'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout trial branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Apply isolated trial variant
        shell: bash
        run: |
          if [[ -s ".trial/$VARIANT.patch" ]]; then
            git apply --check ".trial/$VARIANT.patch"
            git apply ".trial/$VARIANT.patch"
          elif [[ "$VARIANT" != V0 ]]; then
            echo "Missing nonempty patch for $VARIANT" >&2
            exit 1
          fi
      - name: Restore the two spec projects
        run: node .trial/run.mjs "$VARIANT" restore
      - name: Build the two spec projects (Release, warnings as errors)
        run: node .trial/run.mjs "$VARIANT" build
      - name: Warm up and measure five runs per project
        run: node .trial/run.mjs "$VARIANT" test
      - name: Upload TRX, raw timing output and timings JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-77-${{ matrix.variant }}
          path: .ai-work/runner-77/${{ matrix.variant }}/results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  summary:
    if: always() && github.ref == 'refs/heads/trial/runner-77'
    needs: [measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout parity tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download all three variants
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runner-77-*
          path: .ai-work/runner-77-downloads
      - name: Arrange results and require all variants
        if: always()
        shell: bash
        run: |
          mkdir -p .ai-work/runner-77
          for variant in V0 V4 V6; do
            mkdir -p ".ai-work/runner-77/$variant/results"
            if [[ -d ".ai-work/runner-77-downloads/runner-77-$variant" ]]; then
              cp -R ".ai-work/runner-77-downloads/runner-77-$variant/." ".ai-work/runner-77/$variant/results/"
            fi
          done
      - name: Compare complete identities and outcomes and summarize
        if: always()
        run: node .trial/summarize.mjs
      - name: Upload markdown summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-77-summary
          path: .ai-work/runner-77/summary.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
      - name: Require successful measurement jobs
        if: always()
        env:
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: test "$MEASURE_RESULT" = success
