name: Specifications 77 runner trial

on:
  push:
    branches: [trial/runner-77]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-host:
    if: github.ref == 'refs/heads/trial/runner-77'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TRIAL_OUTPUT: ${{ github.workspace }}/.ai-work/runner-77-same-host-${{ github.run_id }}-${{ github.run_attempt }}
      N: '5'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout trial branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Harness self-tests (no .NET build or benchmark)
        run: node --test .trial/same-host.test.mjs
      - name: Archive baseline into three isolated source directories and apply variants
        run: node .trial/same-host.mjs prepare
      - name: Restore all variants sequentially
        run: node .trial/same-host.mjs restore
      - name: Build all variants sequentially (Release, warnings as errors)
        run: node .trial/same-host.mjs build
      - name: Warm up each variant and interleave five measured repetitions on this host
        run: node .trial/same-host.mjs test
      - name: Require same host and strict identity/outcome parity; summarize
        if: always()
        run: node .trial/summarize.mjs
      - name: Upload all variant TRXs, timings, metadata, schedule and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-77-same-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TRIAL_OUTPUT }}/V0/results/
            ${{ env.TRIAL_OUTPUT }}/V4/results/
            ${{ env.TRIAL_OUTPUT }}/V6/results/
            ${{ env.TRIAL_OUTPUT }}/session.json
            ${{ env.TRIAL_OUTPUT }}/summary.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
